[settings]
requirements-in = requirements.txt
main-package = -e .[test]
; setuptools 82+ has no pkg_resources, still used at import time by released add-ons
version-overrides =
    setuptools==81.0.0

[collective.beaker]
url = https://github.com/collective/collective.beaker.git
branch = plone6.1

[collective.compoundcriterion]
url = https://github.com/collective/collective.compoundcriterion.git
branch = plone6-chris-adam

[collective.eeafaceted.collectionwidget]
url = https://github.com/collective/collective.eeafaceted.collectionwidget.git
branch = python3-chris-adam

[collective.eeafaceted.z3ctable]
url = https://github.com/IMIO/collective.eeafaceted.z3ctable.git
branch = plone6_duchenean-chris-adam

[collective.fingerpointing]
url = https://github.com/collective/collective.fingerpointing.git
branch = master

[eea.facetednavigation]
url = https://github.com/chris-adam/eea.facetednavigation.git
branch = develop-chris-adam

[imio.helpers]
url = https://github.com/imio/imio.helpers.git
branch = py3-email-address-headers
